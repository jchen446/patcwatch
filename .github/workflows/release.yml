name: Build distribution
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip wheel --no-deps . -w dist
      - uses: actions/upload-artifact@v4
        with:
          name: patcwatch-wheel
          path: dist/*.whl
